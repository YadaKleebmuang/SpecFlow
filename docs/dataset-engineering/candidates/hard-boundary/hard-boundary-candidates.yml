- intent: optimize_performance
  examples: '- เกม FPS FPS ต่ำ ต้องปรับอะไร?

    - คอมช้าเมื่อล็อกหลายแอป ควรทำอย่างไร?

    - มีอาการ stutter ในเกม ต้องทำอะไร?

    - คอมร้อนเร็ว ต้องทำยังไง?

    - FPS ตกขณะเล่นเกม มีวิธีแก้ไหม?

    - การใช้ CPU สูงทำให้เกมช้า ควรทำอย่างไร?

    - GPU ใช้งานเต็มเมื่อเล่นเกม ต้องปรับอะไร?

    - มี lag ในเกมหลังอัปเดต driver ทำอย่างไร?

    - ต้องการเพิ่มประสิทธิภาพคอมโดยไม่เปลี่ยนฮาร์ดแวร์

    - ทำอย่างไรให้คอมบูตเร็วขึ้น

    - มีอาการ input lag ต้องแก้ไหม?

    - คอมทำงานช้าเมื่อเปิดหลายโปรแกรมพร้อมกัน

    - การตั้งค่าเกมเพื่อเพิ่ม FPS ควรทำอย่างไร?

    - ควรทำอย่างไรเพื่อให้ GPU ไม่ร้อนเกิน

    - วิธีลดเวลาตอบสนองของ Windows

    - ควรลดความละเอียดเพื่อเพิ่ม FPS หรือไม่?

    - วิธีปรับ BIOS เพื่อเพิ่มประสิทธิภาพเกมหรือไม่?

    - วิธีตั้งค่า Nvidia Control Panel เพื่อเพิ่ม FPS?

    - วิธีทำให้ SSD ทำงานเร็วขึ้นในเกม?

    - ทำอย่างไรเมื่อเกมกระตุกหลังอัปเดต OS

    - คอมทำงานช้าเมื่อมีหลายแอปเปิดอยู่

    - วิธีลดอุณหภูมิของ CPU ขณะเล่นเกม

    - วิธีปรับค่า Power Management เพื่อเพิ่ม FPS

    - ควรทำอย่างไรเมื่อ GPU ใช้ 100% ตลอดเวลา

    - ปัญหา stutter ในเกมเมื่อใช้ RTX 3060 ทำอย่างไร

    - วิธีปรับ V-Sync เพื่อให้เกมลื่น

    - เล่นเกมแล้วเฟรมตกเป็นช่วง ๆ แต่ยังไม่อยากเปลี่ยนอะไหล่ ควรปรับตรงไหนก่อน

    - เปิดหลายโปรแกรมแล้วเครื่องหน่วง มีวิธีเช็กว่าอะไรใช้ RAM เยอะไหม

    - พอเปิดเกม CPU วิ่งสูงตลอด มีอะไรที่ควรตั้งค่าก่อนหรือเปล่า

    - ช่วงนี้ Windows เปิดเครื่องช้ากว่าเดิม ควรตรวจอะไรบ้าง'
