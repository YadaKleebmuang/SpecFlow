- intent: optimize_performance
  examples: '|

    - คอมของผมบูทช้ามาก มีวิธีเร่งได้ไหม?

    - มีปัญหา FPS ลดลงในเกมหลังอัปเดต, ทำอย่างไร?

    - คอมทำงานช้าเมื่อเปิดหลายโปรแกรมพร้อมกัน, เคล็ดลับอะไร?

    - พอร์ต USB ทำงานช้า, มีวิธีปรับปรุงไหม?

    - การใช้งานสูงของ CPU ทำให้เครื่องร้อน, ควรทำอย่างไร?

    - มีการกระตุ้นการใช้ SSD เพื่อเพิ่มความเร็วแอปไหม?

    - คอมมี stutter เมื่อเล่นเกม, ต้องแก้ที่ไหน?

    - การจัดการ startup programs ทำให้บูทเร็วขึ้นได้ไหม?

    - แบตเตอรี่คอม laptops แรงลดเร็ว, ควรปรับ power plan อย่างไร?

    - การใช้ thermal paste เก่าทำให้ความร้อนสูง, ควรเปลี่ยนหรือไม่?

    - การอัปเดต driver ทำให้ประสิทธิภาพดีขึ้นไหม?

    - มีวิธีลด latency ในการเชื่อมต่อเครือข่ายไหม?

    - คอมทำงานช้าด้วย background apps, ควรปิดอะไร?

    - การตั้งค่า virtual memory ทำให้ performance ดีขึ้นหรือไม่?

    - คอมรัน Docker ช้า, การตั้งค่า daemon มีอะไรที่ควรปรับ?

    - มีวิธีทำให้ Windows update ไม่กิน CPU มาก?

    - การตั้งค่า BIOS ให้ใช้ XMP ทำให้ RAM ทำงานเร็วขึ้นไหม?

    - ปัญหา screen tearing ในเกม, มีวิธีแก้?

    - คอมทำงานช้าเมื่อเปิดหลายแท็บในเบราว์เซอร์, มีวิธีแก้?

    - มีวิธีตรวจสอบและลบ malware ที่ทำให้ระบบช้า?

    - ความเร็วในการคัดลอกไฟล์ดีขึ้นได้อย่างไร?

    - คอมเล่น VR มี latency สูง ควรทำอย่างไร?

    - การตั้งค่า power plan บน laptop ให้ High Performance มีผลอย่างไร?

    - มีวิธีทำให้ Windows 10 ปรับ performance mode อัตโนมัติไหม?

    - ปัญหา audio latency บนคอม, มีวิธีลดหรือไม่?

    - SSD มี read/write speed ต่ำ ควรทำอย่างไร?

    - คอมมีปัญหา driver conflict, มีวิธีตรวจจับไหม?

    - การใช้ CPU affinity ช่วยลดการใช้ CPU ของแอปบางตัวได้ไหม?

    - ปัญหาการบันทึกวิดีโอ laggy, มีวิธีแก้?

    - มีวิธีตรวจสอบ bottleneck ของระบบด้วยเครื่องมืออะไร?

    - คอมลื่นเมื่อเล่นเกมหลังจากอัปเดต OS, ทำอย่างไร?

    - ควรทำการ defragment HDD หรือไม่?

    - การตั้งค่า firewall มีผลต่อ network performance อย่างไร?

    - คอมใช้เวลานานในการ shutdown, มีวิธีเร่งได้ไหม?'
