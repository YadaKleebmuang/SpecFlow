- intent: ask_cpu_info
  examples: |
    - ควรเลือก CPU ที่มี core จำนวนเท่าไหร่สำหรับการทำงานหลายอย่าง?
    - [cpu](component_type) ทำหน้าที่ อะไร
    - เลือก [cpu](component_type) intel หรือ amd ดีกว่า กัน
    - ทำไม CPU ถึงเปรียบเหมือนสมองของคอม
