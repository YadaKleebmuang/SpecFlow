    - พอเปิดเกม CPU วิ่งสูงตลอด มีอะไรที่ควรตั้งค่าก่อนหรือเปล่า
    - วิธีลดอุณหภูมิของ CPU ขณะเล่นเกม
    - คอมพิวเตอร์ หน่วง มาก เวลาเปิด หลาย หน้าต่าง
