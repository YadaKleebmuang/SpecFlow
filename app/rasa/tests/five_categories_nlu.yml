version: '3.1'
nlu:
- intent: ask_bot_capabilities
  examples: |
    - เพิ่งเข้ามาครั้งแรก บอทมีเครื่องมืออะไรให้ใช้บ้าง
    - ก่อนเริ่มอยากทราบขอบเขตงานของ SpecFlow
    - รวบรวมบริการที่ฉันขอจากคุณได้ให้ดูที
    - แชทนี้ให้ความช่วยเหลือด้านคอมอย่างไรบ้าง
    - หน้ารวมฟังก์ชันของคุณเปิดยังไง
    - คุณตอบคำถามประเภทใดได้บ้าง
    - ฉันควรเริ่มต้นคุยกับผู้ช่วยนี้แบบไหน
    - มีตัวเลือกบริการอะไรให้ฉันกดบ้าง
    - ช่วยอธิบายว่าระบบ SpecFlow ทำงานอะไรได้
    - อยากดูภาพรวมเมนูของผู้ช่วยจัดคอม
- intent: ask_mainboard_info
  examples: |
    - แผง mainboard ในเครื่องทำหน้าที่เชื่อมอะไร
    - จะเช็กว่า CPU อยู่ในรายชื่อรองรับของบอร์ดยังไง
    - ถ้า socket เหมือนกันยังต้องดู BIOS อีกหรือเปล่า
    - ขอหลักการเลือกแผงวงจรหลักให้เข้ากับซีพียู
    - บอร์ดขนาด mATX เทียบกับ ATX มีข้อแตกต่างอะไร
    - ช่องต่ออุปกรณ์บน motherboard มีอะไรให้ดูบ้าง
    - จะรู้ได้จากไหนว่า mainboard รุ่นนี้รับแรมชนิดใด
    - เมนบอร์ดคือศูนย์กลางเชื่อมต่อคอมใช่หรือไม่
    - ทำความเข้าใจคำว่า chipset บนบอร์ดให้ที
    - อ่านสเปค motherboard ก่อนซื้อควรเริ่มตรงไหน
- intent: ask_storage_info
  examples: |
    - สงสัยว่าไดรฟ์ NVMe กับไดรฟ์ SATA ใช้การเชื่อมต่อเดียวกันไหม
    - อธิบายคำว่าสตอเรจสำหรับมือใหม่ที
    - ถ้าเห็นคำว่า M.2 จะรู้ได้ไงว่าเป็น SATA หรือ NVMe
    - อยากแบ่งที่เก็บระบบกับไฟล์งานควรทำแบบใด
    - พอปิดคอมแล้วไฟล์ยังอยู่ในอุปกรณ์เก็บข้อมูลใช่ไหม
    - ความจุและความเร็วไดรฟ์ต่างกันในด้านไหน
    - การแบ่งไดรฟ์ D ในดิสก์เดียวช่วยสำรองไฟล์หรือเปล่า
    - เวลาเลือก NVMe ต้องตรวจสล็อตบอร์ดเรื่องใด
    - storage สำหรับเก็บรูปและงานหมายถึงอะไร
    - อยากเข้าใจความหมายของ read write บน SSD
- intent: ask_psu_info
  examples: |
    - อุปกรณ์ power supply ส่งพลังงานให้เครื่องอย่างไร
    - ช่วยอธิบายฉลาก 80 PLUS Gold บนแหล่งจ่ายไฟ
    - เลือก PSU ให้กำลังไฟเพียงพอต้องรวมส่วนใดบ้าง
    - พาวเวอร์ซัพพลายต้องเผื่อโหลดสูงสุดเท่าไร
    - หัวต่อสาย PSU กับการ์ดจอต้องตรงกันไหม
    - ระบบตัดกระแสเกิน OCP ใน PSU ทำงานเพื่ออะไร
    - ความหมายของ Bronze ที่กล่อง PSU คืออะไร
    - แหล่งจ่ายไฟคอมแปลงไฟบ้านเป็นอะไร
    - PSU วัตต์เยอะกับประสิทธิภาพสูงคืออย่างเดียวกันไหม
    - ข้อมูลใดบอกว่า PSU มีวงจรป้องกันลัดวงจร
- intent: ask_case_info
  examples: |
    - ตัวถังที่ครอบคอมมีหน้าที่นอกจากความสวยหรือไม่
    - อ่านคู่มือเคสเพื่อดูระยะการ์ดจออย่างไร
    - ควรวางพัดลมดูดเข้าเคสกับเป่าออกตรงใด
    - เคสที่ใส่บอร์ด ATX ได้ต้องดูข้อมูลช่องไหน
    - สายไฟรกภายในตัวถังมีผลกับทางลมหรือเปล่า
    - ถ้าติดหม้อน้ำด้านหน้า case พื้นที่ GPU จะลดไหม
    - เลือกเคสขนาดเล็กต้องตรวจระยะอะไรเป็นพิเศษ
    - ตัวกรองฝุ่นหน้าเคสมีประโยชน์ด้านใด
    - หลักการไหลของอากาศใน case เป็นอย่างไร
    - ความสูงชุดลมที่เคสรองรับหาได้จากไหน
- intent: ask_cooler_info
  examples: |
    - ซีพียูร้อนจนลด clock เรียกปรากฏการณ์อะไร
    - ช่วยอธิบายการถ่ายเทความร้อนของฮีตซิงก์
    - อุปกรณ์ AIO ใช้ปั๊มกับหม้อน้ำทำงานร่วมกันอย่างไร
    - ซื้อชุดน้ำแล้วจะเย็นกว่าชุดลมแน่นอนหรือเปล่า
    - ซิลิโคนระหว่าง CPU และ cooler มีบทบาทใด
    - ทำไมขายึดชุดระบายความร้อนต้องเข้ากับ socket
    - ก่อนใส่ CPU cooler ต้องเช็กว่าจะชนแรมไหม
    - ต้องพิจารณาอะไรเมื่อเปรียบเทียบ air cooler กับ AIO
    - ชุดระบายความร้อนซีพียูช่วยป้องกัน throttling อย่างไร
    - พัดลมฮีตซิงก์พาความร้อนออกจากซีพียูแบบไหน
- intent: greet
  examples: |
    - หวัดดีผู้ช่วยจัดสเปค ยินดีที่ได้รู้จัก
    - สวัสดีตอนบ่าย แอดมิน SpecFlow
    - ฮัลโหลบอทคอมพิวเตอร์
- intent: goodbye
  examples: |
    - ได้ข้อมูลครบแล้ว ไว้มาคุยกันวันหลัง
    - ขอจบแชทไว้เท่านี้ บ๊ายบายผู้ช่วย
    - ไปก่อนละ ไว้สอบถามใหม่พรุ่งนี้
- intent: build_pc
  examples: |
    - ช่วยจัดเครื่องใหม่งบ[32500](budget)สำหรับ[เขียนโปรแกรม](usage)
    - ต้องการประกอบพีซี[งานกราฟิก](usage)ราคาไม่เกิน[47500](budget)
    - ขอรายการสเปคคอมใหม่ไว้[ตัดต่อวิดีโอ](usage)งบ[38500](budget)
- intent: upgrade_pc
  examples: |
    - คอมเก่าอยากเปลี่ยนอะไหล่ให้แรงขึ้นควรเริ่มตรงไหน
    - จะอัปเกรดพีซีที่มีอยู่ต้องแจ้งสเปคอะไรบ้าง
    - ช่วยวางแผนเปลี่ยนชิ้นส่วนเครื่องเดิมให้ที
- intent: inform_budget
  examples: |
    - ตั้งงบไว้ที่[32500](budget)
    - จำนวนเงินที่จ่ายได้คือ[47500](budget)
    - มีวงเงิน[38500](budget)สำหรับเครื่องนี้
- intent: inform_usage
  examples: |
    - จุดประสงค์หลักคือ[เขียนโปรแกรมเว็บ](usage)
    - งานประจำคือ[ตัดต่อวิดีโอใน Premiere](usage)
    - ใช้สำหรับ[พิมพ์เอกสารสำนักงาน](usage)ทุกวัน
- intent: inform_current_specs
  examples: |
    - เครื่องเดิม CPU Ryzen 5600 RAM 16GB กับ RTX 3060
    - สเปคปัจจุบันใช้ i5 12400 แรม 8GB SSD 256GB
    - ในเครื่องมี Ryzen 3600 การ์ด RX 6600 และ RAM 32GB
- intent: ask_cpu_info
  examples: |
    - อธิบายบทบาทหน่วยประมวลผลกลางในคอมให้เข้าใจที
    - จำนวนคอร์กับเธรดของซีพียูบอกอะไร
    - ทำไม CPU จึงถูกเรียกว่าสมองของเครื่อง
- intent: ask_gpu_info
  examples: |
    - หน่วยประมวลผลกราฟิกช่วยสร้างภาพได้อย่างไร
    - หน่วยความจำบนการ์ดจอ VRAM มีหน้าที่ใด
    - อธิบายความสำคัญของ GPU ต่อภาพในเกมที
- intent: ask_ram_info
  examples: |
    - หน่วยความจำชั่วคราวแรมใช้เก็บอะไรขณะเปิดคอม
    - การเพิ่มปริมาณ RAM ช่วยเวลาเปิดหลายแอปยังไง
    - แรม DDR5 เสียบแทน DDR4 ได้หรือไม่
- intent: ask_ssd_hdd_diff
  examples: |
    - เทียบจุดเด่น SSD และ HDD ให้คนเริ่มประกอบคอมที
    - หากเลือกเก็บไฟล์ใน HDD เทียบ SSD ต่างกันด้านใด
    - SSD เมื่อเทียบกับ HDD เปิดวินโดวส์ต่างกันไหม
- intent: optimize_performance
  examples: |
    - เปิดคอมแล้วรอนานอยากปรับให้บูตไวขึ้น
    - Windows หน่วงมากมีวิธีปรับแต่งเบื้องต้นหรือไม่
    - แอปเริ่มพร้อมระบบเยอะจนเครื่องช้าต้องทำยังไง
- intent: inform_future_upgrade
  examples: |
    - อยากให้สเปคนี้รองรับการเปลี่ยนอะไหล่ในปีถัดไป
    - เลือกแพลตฟอร์มเผื่อเพิ่มสเปคภายหลังให้ที
    - วางแผนขยายเครื่องในอนาคตจึงอยากเผื่อไว้ก่อน
- intent: affirm
  examples: |
    - ตกลงตามที่ถามมาเลย
    - ยืนยันว่าเอาตามนั้น
    - ถูกต้องเลยครับใช่แล้ว
- intent: deny
  examples: |
    - ไม่เอาตัวเลือกนั้นนะ
    - ปฏิเสธครับไม่ต้องการ
    - ไม่ใช่ตามที่ถามมา
