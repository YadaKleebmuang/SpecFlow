version: "3.1"

nlu:
- intent: greet
  examples: |
    - อรุณสวัสดิ์แอดมิน
    - หวัดดีบอท
    - ขอทักทายหน่อยครับ
    - สวัสดิครับบอทจัดสเปค

- intent: goodbye
  examples: |
    - บายบ๊ายจ้า
    - ขอตัวก่อนนะครับ
    - เดี๋ยวแวะมาใหม่ครับ
    - แต้งกิ้วมากครับ

- intent: build_pc
  examples: |
    - งบประมาณ [28000](budget) อยากประกอบคอมเอาไว้ [เรียนเขียนโปรแกรมกับเล่นเกม](usage)
    - ช่วยเลือกชิ้นส่วนคอมพิวเตอร์งบ [45,000](budget) บาท เน้น [เรนเดอร์งาน 3D](usage)
    - แนะนำคอมตั้งโต๊ะราคา [18k](budget) สำหรับ [พิมพ์เอกสารออฟฟิศ](usage)
    - [35 หมื่น](budget) ไม่ใช่สิ [3 หมื่นห้า](budget) จัดคอม [สตรีมเกมส์](usage) ให้หน่อย
    - อยากได้เครื่องคอมประกอบใหม่ [งบไม่อั้น](budget) ปรับกราฟิก [สุดทุกเกม](usage)
    - ช่วยจัดสเปคคอม [22000](budget) เอามา [แต่งภาพและตัดต่อคลิป](usage)
    - มีงบประมาณ [12000](budget) บาท อยากได้คอม [ดูหนังฟังเพลงพิมพ์งาน](usage)

- intent: upgrade_pc
  examples: |
    - เครื่องเก่าเริ่มหมอง อยากเปลี่ยนอะไหล่บางชิ้น
    - อัปเกรดคอมพิวเตอร์สเปคดั้งเดิมให้แรงเท่าคอมยุคนี้
    - มีงบ 5,000 บาท อยากอัปสเปคเครื่องเดิมให้เล่นเกมลื่นขึ้น
    - คอมพิวเตอร์ช้าลงมาก ควรอัปเกรดชิ้นส่วนไหนก่อน
    - ช่วยวางแผนอัปเกรดคอมพิวเตอร์เก่า 5 ปีทีครับ
    - อัปเกรดเครื่องเดิมเพื่อนำไป [ทำงานตัดต่อภาพ](usage)

- intent: inform_budget
  examples: |
    - [28000](budget)
    - ไม่เกิน [35,000](budget) บาท
    - ตั้งงบไว้ [45k](budget)
    - มีงบ [2 หมื่นห้า](budget)
    - ประมาณ [4 หมื่น](budget)
    - [งบไม่อั้น](budget) ครับ

- intent: inform_usage
  examples: |
    - เน้น [เล่นเกม fps ปรับภาพสูง](usage)
    - ใช้ [เรนเดอร์โมเดล 3d และสถาปัตย์](usage)
    - เอามา [ตัดต่อวิดีโอ 4k ลงโซเชียล](usage)
    - [พิมพ์งานเอกสารออฟฟิศทั่วไป](usage)
    - [เรียนออนไลน์ผ่านซูมและทำรายงาน](usage)
    - เอาไว้ [เทรดหุ้นเปิดเว็บหลายสิบแท็บ](usage)

- intent: inform_current_specs
  examples: |
    - สเปกปัจจุบัน intel core i5 8400 [ram](component_type) 8gb
    - เครื่องเดิมใช้ ryzen 5 1600 [การ์ดจอ](component_type) gtx 1050
    - มี [ssd](component_type) 240gb ตัวเก่าติดเครื่องอยู่
    - ตอนนี้ใช้ i3 gen 7 กับ [การ์ดจอ](component_type) gt 730
    - สเปคคอมเดิม gtx 960 [แรม](component_type) 8gb

- intent: ask_cpu_info
  examples: |
    - ซีพียูสำคัญยังไงกับคอมพิวเตอร์
    - Core และ Thread ใน [cpu](component_type) คืออะไร
    - ทำไมต้องดูความเร็ว GHz ของ [cpu](component_type)
    - เลือก [cpu](component_type) ค่ายไหนดีระหว่าง Intel กับ AMD

- intent: ask_gpu_info
  examples: |
    - การ์ดจอทำหน้าที่อะไรในการเล่นเกม
    - [gpu](component_type) แยก กับ การ์ดจอในตัว ต่างกันตรงไหน
    - ทำไมเล่นเกมสามมิติต้องใช้ [การ์ดจอ](component_type) แรงๆ
    - VRAM ของ [การ์ดจอ](component_type) มีผลต่อความละเอียดภาพอย่างไร

- intent: ask_ram_info
  examples: |
    - แรมทำหน้าที่อะไรในระบบคอมพิวเตอร์
    - [ram](component_type) 16GB กับ 32GB ต่างกันมากไหมเวลาตัดต่อ
    - ความเร็ว Bus ของ [แรม](component_type) ช่วยให้เครื่องไวขึ้นจริงไหม
    - ทำไมเปิดเบราว์เซอร์เยอะแล้ว [ram](component_type) เต็ม

- intent: ask_ssd_hdd_diff
  examples: |
    - เอสเอสดี กับ ฮาร์ดดิสก์ ต่างกันยังไง
    - ทำไมลงวินโดวส์บน [ssd](component_type) ถึงเปิดเครื่องไวกว่า [hdd](component_type)
    - ข้อดีของ [ssd](component_type) M.2 NVMe คืออะไร
    - [hdd](component_type) จานหมุนยังจำเป็นต้องใช้อยู่ไหม

- intent: optimize_performance
  examples: |
    - เครื่องหน่วงและค้างบ่อย มีวิธีตั้งค่าให้ลื่นขึ้นไหม
    - คอมพิวเตอร์ช้าลง อยากปรับแต่งระบบให้เปิดโปรแกรมเร็วขึ้น
    - ปิดโปรแกรมรันเบื้องหลังเวลาเปิดเครื่องทำอย่างไร
    - เล่นเกมแล้วเฟรมเรตตก มีวิธีปรับแต่งการ์ดจอไหม
    - วิธีทำความสะอาดไฟล์ขยะและเพิ่มความเร็วคอม
    - ปรับแต่ง Windows ให้ทำงานเต็มประสิทธิภาพทำยังไง

- intent: inform_future_upgrade
  examples: |
    - อยากได้บอร์ดกับพาวเวอร์ที่ [เผื่ออัปเกรดอนาคต](future_upgrade)
    - เลือกอุปกรณ์แบบ [ใช้ยาวๆ เผื่อเปลี่ยนการ์ดจอ](future_upgrade)
    - ขอสเปกที่ [รองรับการอัปเกรดในวันหน้า](future_upgrade)

- intent: affirm
  examples: |
    - ใช่ครับ จัดตามนี้เลย
    - เอาแบบเผื่ออัปเกรดครับ
    - ตกลงครับผม

- intent: deny
  examples: |
    - ไม่เอาครับ เน้นประหยัด
    - ไม่ต้องเผื่ออัปเกรดครับ
    - ไม่จำเป็นครับเอาธรรมดาพอ
